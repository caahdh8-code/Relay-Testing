<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESP32 Relay Push Button</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

h1 {
  color: #38bdf8;
  margin-bottom: 8px;
}

.subtitle {
  color: #cbd5e1;
  margin-bottom: 25px;
}

.container {
  max-width: 450px;
  margin: auto;
}

.relay-card {
  background: #1e293b;
  padding: 25px;
  margin-bottom: 20px;
  border-radius: 18px;
}

.relay-card h2 {
  margin-top: 0;
}

button {
  width: 100%;
  max-width: 230px;
  height: 75px;
  border: none;
  border-radius: 15px;
  background: #2563eb;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;

  /* Important for mobile touch */
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

button.pressed {
  background: #16a34a;
  transform: scale(0.96);
}

.status {
  margin-top: 18px;
  font-size: 17px;
  font-weight: bold;
  color: #f87171;
}

.status.on {
  color: #4ade80;
}

#connection {
  margin: 20px 0;
  color: #facc15;
}
</style>
</head>

<body>

<h1>ESP32 RELAY CONTROL</h1>

<p class="subtitle">
Press and hold the button to activate relay
</p>

<div id="connection">Connecting to Firebase...</div>

<div class="container">

  <div class="relay-card">
    <h2>RELAY 1</h2>
    <button data-relay="Relay1">PRESS & HOLD</button>
    <div class="status" id="status1">OFF</div>
  </div>

  <div class="relay-card">
    <h2>RELAY 2</h2>
    <button data-relay="Relay2">PRESS & HOLD</button>
    <div class="status" id="status2">OFF</div>
  </div>

  <div class="relay-card">
    <h2>RELAY 3</h2>
    <button data-relay="Relay3">PRESS & HOLD</button>
    <div class="status" id="status3">OFF</div>
  </div>

</div>

<script>

// FIREBASE DATABASE
const databaseURL =
"https://relay-testing-f5dfd-default-rtdb.asia-southeast1.firebasedatabase.app";

let activeRelay = {};
let heartbeat = {};
let pointerRelay = {};

function statusID(relay) {
  if (relay === "Relay1") return "status1";
  if (relay === "Relay2") return "status2";
  return "status3";
}

// UPDATE FIREBASE
async function updateFirebase(data) {

  try {

    const response = await fetch(
      databaseURL + "/RelayTesting.json",
      {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      }
    );

    if (!response.ok) {
      throw new Error("Firebase update failed");
    }

    document.getElementById("connection").textContent =
      "Firebase Connected";

    return true;

  } catch (error) {

    document.getElementById("connection").textContent =
      "Firebase Connection Error";

    return false;
  }
}

// PRESS BUTTON
async function pressButton(relay) {

  if (activeRelay[relay]) return;

  activeRelay[relay] = true;

  const button = document.querySelector(
    '[data-relay="' + relay + '"]'
  );

  button.classList.add("pressed");

  const status = document.getElementById(statusID(relay));
  status.textContent = "ON";
  status.classList.add("on");

  const heartbeatKey = relay + "Heartbeat";

  const success = await updateFirebase({
    [relay]: true,
    [heartbeatKey]: Date.now()
  });

  if (!success) {
    releaseButton(relay);
    return;
  }

  // Send heartbeat while button is held
  heartbeat[relay] = setInterval(() => {

    if (activeRelay[relay]) {

      updateFirebase({
        [relay]: true,
        [heartbeatKey]: Date.now()
      });

    }

  }, 500);
}

// RELEASE BUTTON
async function releaseButton(relay) {

  if (!activeRelay[relay]) return;

  activeRelay[relay] = false;

  clearInterval(heartbeat[relay]);

  const button = document.querySelector(
    '[data-relay="' + relay + '"]'
  );

  button.classList.remove("pressed");

  const status = document.getElementById(statusID(relay));
  status.textContent = "OFF";
  status.classList.remove("on");

  await updateFirebase({
    [relay]: false
  });
}

// BUTTON TOUCH AND MOUSE EVENTS
document.querySelectorAll("[data-relay]").forEach(button => {

  const relay = button.dataset.relay;

  button.addEventListener("pointerdown", event => {

    event.preventDefault();

    pointerRelay[event.pointerId] = relay;

    button.setPointerCapture(event.pointerId);

    pressButton(relay);
  });

  button.addEventListener("pointerup", event => {

    releaseButton(relay);

    delete pointerRelay[event.pointerId];
  });

  button.addEventListener("pointercancel", event => {

    releaseButton(relay);

    delete pointerRelay[event.pointerId];
  });

  button.addEventListener("lostpointercapture", () => {
    releaseButton(relay);
  });

});

// Release if browser loses focus
window.addEventListener("blur", () => {

  Object.keys(activeRelay).forEach(relay => {
    releaseButton(relay);
  });

});

// INITIALIZE ALL RELAYS OFF
updateFirebase({
  Relay1: false,
  Relay2: false,
  Relay3: false
});

</script>

</body>
</html>
