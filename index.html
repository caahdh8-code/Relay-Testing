<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Push Button Control</title>

<style>
body {
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}

h1 { color: #38bdf8; }

.card {
  background: #1e293b;
  padding: 25px;
  margin: 20px auto;
  max-width: 400px;
  border-radius: 15px;
}

button {
  width: 100%;
  padding: 20px;
  border: none;
  border-radius: 10px;
  background: #0284c7;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

button:disabled {
  background: #64748b;
}

.status {
  margin-top: 15px;
  color: #38bdf8;
}
</style>
</head>

<body>

<h1>ESP32 RELAY CONTROL</h1>
<p>ONE CLICK PUSH BUTTON</p>

<div id="connection">Connecting...</div>

<div id="buttons"></div>

<script>

const FIREBASE =
"https://relay-testing-f5dfd-default-rtdb.asia-southeast1.firebasedatabase.app/RelayTesting";

const relays = ["Relay1", "Relay2", "Relay3"];

function createButtons() {
  const area = document.getElementById("buttons");

  relays.forEach((relay, index) => {
    area.innerHTML += `
      <div class="card">
        <h2>RELAY ${index + 1}</h2>
        <button id="btn${index}" onclick="pressRelay('${relay}', ${index})">
          PRESS ONCE
        </button>
        <div class="status" id="status${index}">READY</div>
      </div>
    `;
  });
}

async function pressRelay(relay, index) {

  const button = document.getElementById("btn" + index);
  const status = document.getElementById("status" + index);

  button.disabled = true;
  status.textContent = "SENDING...";

  try {

    // Reset first to ensure a fresh rising edge
    let response = await fetch(
      `${FIREBASE}/${relay}.json`,
      {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: "false"
      }
    );

    if (!response.ok) throw new Error("Firebase reset failed");

    // Send one-click command
    response = await fetch(
      `${FIREBASE}/${relay}.json`,
      {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: "true"
      }
    );

    if (!response.ok) throw new Error("Firebase ON failed");

    status.textContent = "COMMAND SENT";

    // Keep command ON long enough for ESP32 to read
    await new Promise(resolve => setTimeout(resolve, 1000));

    // Reset command
    response = await fetch(
      `${FIREBASE}/${relay}.json`,
      {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: "false"
      }
    );

    if (!response.ok) throw new Error("Firebase OFF failed");

    status.textContent = "READY";

  } catch (error) {
    status.textContent = "FIREBASE ERROR";
    console.error(error);

  } finally {
    button.disabled = false;
  }
}

createButtons();

async function checkFirebase() {
  try {
    const response = await fetch(`${FIREBASE}.json`);
    if (!response.ok) throw new Error();

    document.getElementById("connection").textContent =
      "FIREBASE CONNECTED";

  } catch (error) {
    document.getElementById("connection").textContent =
      "FIREBASE DISCONNECTED";
  }
}

checkFirebase();

</script>
</body>
</html>
