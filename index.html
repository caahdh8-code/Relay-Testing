<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Relay Control</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  text-align: center;
}

h1 {
  margin-top: 25px;
  color: #38bdf8;
}

.subtitle {
  color: #b8c4d6;
  margin-bottom: 35px;
}

.container {
  max-width: 500px;
  margin: auto;
}

.relay-card {
  background: #1e293b;
  padding: 25px;
  margin: 18px 0;
  border-radius: 16px;
  border: 1px solid #334155;
}

.relay-card h2 {
  margin-top: 0;
}

button {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 12px;
  background: #0284c7;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  background: #0369a1;
  transform: scale(0.98);
}

button:disabled {
  background: #64748b;
  cursor: not-allowed;
}

.status {
  margin-top: 15px;
  color: #94a3b8;
  font-size: 14px;
}

#connection {
  margin: 20px 0;
  color: #fbbf24;
}
</style>
</head>

<body>

<h1>ESP32 RELAY CONTROL</h1>
<p class="subtitle">One Click Push Button System</p>

<div id="connection">Connecting to Firebase...</div>

<div class="container">

  <div class="relay-card">
    <h2>RELAY 1</h2>
    <button onclick="pressRelay('Relay1', this)">
      PRESS RELAY 1
    </button>
    <div class="status" id="status1">Ready</div>
  </div>

  <div class="relay-card">
    <h2>RELAY 2</h2>
    <button onclick="pressRelay('Relay2', this)">
      PRESS RELAY 2
    </button>
    <div class="status" id="status2">Ready</div>
  </div>

  <div class="relay-card">
    <h2>RELAY 3</h2>
    <button onclick="pressRelay('Relay3', this)">
      PRESS RELAY 3
    </button>
    <div class="status" id="status3">Ready</div>
  </div>

</div>

<script>

// FIREBASE CONFIGURATION
const FIREBASE_URL =
"https://relay-testing-f5dfd-default-rtdb.asia-southeast1.firebasedatabase.app";

// Send one-click command
async function pressRelay(relayName, button) {

  const number = relayName.replace("Relay", "");
  const status = document.getElementById("status" + number);

  button.disabled = true;
  status.textContent = "Sending command...";

  try {

    // Send TRUE to Firebase
    const response = await fetch(
      `${FIREBASE_URL}/RelayTesting/${relayName}.json`,
      {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(true)
      }
    );

    if (!response.ok) {
      throw new Error("Firebase write failed");
    }

    status.textContent = "Command sent!";

    // Keep TRUE briefly so ESP32 can detect it
    await new Promise(resolve => setTimeout(resolve, 1000));

    // Reset Firebase to FALSE
    const resetResponse = await fetch(
      `${FIREBASE_URL}/RelayTesting/${relayName}.json`,
      {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(false)
      }
    );

    if (!resetResponse.ok) {
      throw new Error("Firebase reset failed");
    }

    status.textContent = "Ready for next press";

  } catch (error) {

    status.textContent = "Error: Check Firebase connection";
    console.error(error);

  } finally {
    button.disabled = false;
  }
}


// Check Firebase connection
async function checkFirebase() {

  const connection = document.getElementById("connection");

  try {

    const response = await fetch(
      `${FIREBASE_URL}/RelayTesting.json`
    );

    if (!response.ok) {
      throw new Error("Connection failed");
    }

    connection.textContent = "Firebase Connected";
    connection.style.color = "#4ade80";

  } catch (error) {

    connection.textContent = "Firebase Disconnected";
    connection.style.color = "#f87171";

  }
}


// Initialize all relay commands as OFF
async function initializeFirebase() {

  try {

    const response = await fetch(
      `${FIREBASE_URL}/RelayTesting.json`,
      {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          Relay1: false,
          Relay2: false,
          Relay3: false
        })
      }
    );

    if (!response.ok) {
      throw new Error("Initialization failed");
    }

    checkFirebase();

  } catch (error) {

    document.getElementById("connection").textContent =
      "Firebase Initialization Failed";

    console.error(error);
  }
}

initializeFirebase();

</script>

</body>
</html>
