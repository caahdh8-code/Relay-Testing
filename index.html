<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay Testing</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      text-align: center;
      padding: 24px 12px;
      color: #222;
    }
    h1 { color: #174ea6; }
    .relay {
      background: white;
      max-width: 400px;
      margin: 18px auto;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 10px #0001;
    }
    .status { font-weight: bold; margin: 14px; }
    button {
      border: 0;
      padding: 12px 24px;
      margin: 5px;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .on { background: #168447; }
    .off { background: #d93025; }
    #connection { font-weight: bold; }
  </style>
</head>

<body>
  <h1>Relay Testing</h1>
  <p>ESP32 Relay Control Panel</p>
  <p id="connection">Connecting to Firebase...</p>

  <div id="controls"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCLwdDM4-6FUgAv7mDvN1mNpn2zzpiJgJQ",
      authDomain: "relay-testing-f5dfd.firebaseapp.com",
      databaseURL: "https://relay-testing-f5dfd-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "relay-testing-f5dfd",
      storageBucket: "relay-testing-f5dfd.firebasestorage.app",
      messagingSenderId: "593606294584",
      appId: "1:593606294584:web:be9faa41bc5ca5d13d3acd",
      measurementId: "G-RXRKC0VETR"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const root = "RelayTesting";
    const controls = document.getElementById("controls");

    function showError(error) {
      document.getElementById("connection").textContent =
        "Firebase error: " + error.message;
    }

    for (let i = 1; i <= 3; i++) {
      const card = document.createElement("div");
      card.className = "relay";
      card.innerHTML = `
        <h2>Relay ${i}</h2>
        <p class="status" id="status${i}">Status: Unknown</p>
        <button class="on" id="on${i}">ON</button>
        <button class="off" id="off${i}">OFF</button>
      `;
      controls.appendChild(card);

      const ref = db.ref(root + "/Relay" + i);

      document.getElementById("on" + i).onclick = () =>
        ref.set(true).catch(showError);

      document.getElementById("off" + i).onclick = () =>
        ref.set(false).catch(showError);

      ref.on("value", snapshot => {
        const value = snapshot.val();
        document.getElementById("status" + i).textContent =
          "Status: " +
          (value === true ? "ON" :
           value === false ? "OFF" : "Not set");
      }, showError);
    }

    db.ref(".info/connected").on("value", snapshot => {
      document.getElementById("connection").textContent =
        snapshot.val() ? "Firebase connected" : "Firebase disconnected";
    });
  </script>
</body>
</html>
